onboarding = false
# herdr configuration — ported from ~/.tmux.conf

[theme]
# Ayu Dark structure with the NoPing palette (noping.com src/styles/global.css,
# --np-*): near-black backgrounds and the brand green. Base is only a fallback.
# The previous pure Ayu overrides are in config.toml.bak-ayu-20261030.
name = "catppuccin"
auto_switch = false

[theme.custom]
accent = "#9CFF2E"         # np-green
panel_bg = "#0A0C0E"       # np-bg-1
sidebar_bg = "#050607"     # np-bg-0: darker than panes, separates the sidebar
surface_dim = "#050607"    # np-bg-0
surface0 = "#171B1F"       # np-bg-3 (inactive pane bg)
surface1 = "#1F252A"       # np-bg-4 (selection)
active_row_bg = "#192411"  # np-green-soft (10% green) over np-bg-1
text = "#B3B5B6"           # np-fg-dim over np-bg-1
subtext0 = "#848687"       # np-fg-mute over np-bg-1
green = "#9CFF2E"          # np-green
teal = "#1AE5A0"           # np-good
blue = "#2EE6FF"           # np-cyan
mauve = "#8A5BFF"          # np-purple
peach = "#FF7A1A"          # np-bad
yellow = "#FFB454"         # ayu
red = "#F07178"            # ayu

[keys]
prefix = "ctrl+b"

# splits: tmux `o` = split-window -v (below), `e` = split-window -h (right)
split_horizontal = "prefix+o"
split_vertical = "prefix+e"
edit_scrollback = "prefix+shift+e"   # moved off prefix+e

# vim-style pane focus (same as tmux binds h/j/k/l)
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# tabs ~ tmux windows: `n` = new-window, `Tab` = next-window
new_tab = "prefix+n"
next_tab = "prefix+tab"
previous_tab = "prefix+p"
switch_tab = "prefix+1..9"   # prefix+1..prefix+9 vai direto para a tab N
cycle_pane_next = ""
cycle_pane_previous = ""

rename_pane = "prefix+shift+p"  # padrão do herdr; prefix+r agora iguala as panes (abaixo)
resize_mode = "prefix+ctrl+r"  # tmux used prefix+ctrl+hjkl; herdr uses a resize mode

detach = "prefix+q"          # tmux `q` = kill-session
zoom = "prefix+z"            # tmux-power-zoom trigger
toggle_sidebar = "prefix+b"

# prefix+w jumps straight to the next workspace (Local -> wsl...); the picker
# that used to live there moves to prefix+ctrl+w.
next_workspace = "prefix+w"
workspace_picker = "prefix+ctrl+w"

# legado; switch_tab acima e a forma preferida. mantido para ctrl+1..9 direto.
[keys.indexed]
tabs = "ctrl"                # ctrl+1..9, like the C-1..C-5 binds

# prefix+r: distribui igualmente as panes da tab em foco (o herdr não tem esse comando)
[[keys.command]]
key = "prefix+r"
type = "shell"
command = "/opt/homebrew/bin/python3 -I /Users/rmancan/.claude/skills/work/scripts/equalizar_panes.py"

[ui]
mouse_capture = true         # set -g mouse on
copy_on_select = true
pane_borders = true

show_agent_labels_on_pane_borders = false
status_indicators = "symbols"   # distinct glyphs per state instead of colored dots

sidebar_width = 46       # ultrawide screen: room for the tab name after agent + ctx
sidebar_max_width = 50

# $idx, $name and $ctx come from bin/herdr-tab-index.py: tab position (the
# number prefix+N jumps to), herdr agent name, and context percentage.
# One line per agent: tab number · state · agent · context · tab name.
# Workspace is left out: everything lives in "noping", so it only repeated.
[ui.sidebar.agents]
row_gap = 0
rows = [[
  { token = "$idx", fg = "#6FCF1E" },   # np-green-lo
  "state_icon",
  { token = "$name", bold = true },
  { token = "$ctx", fg = "#9CFF2E" },   # np-green
  { token = "tab", fg = "#848687" },    # np-fg-mute
]]

# $claude, $codex and $others also come from bin/herdr-tab-index.py: provider
# icon, connected agents and account windows used, one line each under the
# space; $others lists any other agent kind (kimi...) with a robot icon.
[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  [{ token = "$claude", fg = "#D97757" }],   # Claude brand orange
  [{ token = "$codex", fg = "#B3B5B6" }],    # np-fg-dim
  [{ token = "$others", fg = "#2EE6FF" }],   # np-cyan
]

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.sound]
enabled = true               # replaces the afplay bell hooks

[session]
resume_agents_on_restore = true   # tmux-resurrect equivalent

[experimental]
pane_history = true               # ~ @resurrect-capture-pane-contents

[advanced]
scrollback_limit_bytes = 10000000
